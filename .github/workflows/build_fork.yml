name: Build Fork Image

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build"
        required: true
        default: feat/theme-picker

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize ref for tag
        id: tag
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          echo "value=$(printf '%s' "$BUILD_REF" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wishlist:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/wishlist:sha-${{ steps.tag.outputs.sha }}
          build-args: |
            SHA=${{ steps.tag.outputs.sha }}
            VERSION=${{ inputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
